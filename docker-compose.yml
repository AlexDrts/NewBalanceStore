version: '3.8'

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

maildev:

    image: maildev/maildev
    ports:
      - "1080:1080" # Веб-интерфейс для просмотра писем: http://localhost:1080
      - "1025:1025" # SMTP порт для бэкенда

